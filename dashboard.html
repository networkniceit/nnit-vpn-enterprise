<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NNIT VPN - Admin Dashboard</title>
<style>
  :root {
    --blue: #00CFFF;
    --violet: #9B5CFF;
    --bg: #0B0B1F;
    --card: #1C1C2E;
    --green: #2AFF9B;
    --red: #FF4C4C;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1 {
    color: var(--blue);
    font-size: 28px;
    margin-bottom: 0;
  }
  .subtitle { color: var(--violet); margin-top: 4px; margin-bottom: 24px; }
  .key-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  input {
    background: var(--card);
    border: 1px solid #333;
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    flex: 1;
    min-width: 200px;
  }
  button {
    background: var(--blue);
    color: var(--bg);
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
  }
  .stats-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 160px;
  }
  .stat-label { color: #888; font-size: 12px; }
  .stat-value { font-size: 26px; font-weight: bold; color: var(--green); margin-top: 4px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid #2a2a3d;
    font-size: 14px;
  }
  th { color: #888; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .error-box {
    background: rgba(255,76,76,0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .delete-btn {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 6px;
  }
  .empty-state { color: #666; padding: 20px; text-align: center; }
</style>
</head>
<body>
  <h1>NNIT VPN — Admin Dashboard</h1>
  <div class="subtitle">Network Nice IT Tec</div>

  <div class="key-bar">
    <input type="password" id="adminKey" placeholder="Admin key" />
    <button onclick="saveKeyAndLoad()">Connect</button>
  </div>

  <div id="errorBox"></div>

  <div class="stats-row" id="statsRow" style="display:none;">
    <div class="stat-card">
      <div class="stat-label">TOTAL USERS</div>
      <div class="stat-value" id="statTotal">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">NEW (24H)</div>
      <div class="stat-value" id="stat24h">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">NEW (7D)</div>
      <div class="stat-value" id="stat7d">-</div>
    </div>
  </div>

  <table id="usersTable" style="display:none;">
    <thead>
      <tr>
        <th>Email</th>
        <th>Name</th>
        <th>UID</th>
        <th>Joined</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="usersBody"></tbody>
  </table>

  <div id="emptyState" class="empty-state" style="display:none;">No users yet.</div>

<script>
  const API_URL = 'https://nnit-vpn-enterprise-production.up.railway.app/api';

  function getKey() {
    return localStorage.getItem('nnit_admin_key') || '';
  }

  function saveKeyAndLoad() {
    const key = document.getElementById('adminKey').value.trim();
    if (key) {
      localStorage.setItem('nnit_admin_key', key);
    }
    loadAll();
  }

  function showError(msg) {
    document.getElementById('errorBox').innerHTML =
      msg ? `<div class="error-box">${msg}</div>` : '';
  }

  async function loadAll() {
    const key = getKey();
    if (!key) {
      showError('Enter your admin key above and click Connect.');
      return;
    }
    showError('');

    try {
      const statsRes = await fetch(`${API_URL}/admin/stats`, {
        headers: { 'x-admin-key': key },
      });
      const statsJson = await statsRes.json();

      if (!statsJson.success) {
        showError(statsJson.error || 'Failed to load stats');
        return;
      }

      document.getElementById('statsRow').style.display = 'flex';
      document.getElementById('statTotal').textContent = statsJson.stats.totalUsers;
      document.getElementById('stat24h').textContent = statsJson.stats.newUsersLast24h;
      document.getElementById('stat7d').textContent = statsJson.stats.newUsersLast7d;

      const usersRes = await fetch(`${API_URL}/admin/users`, {
        headers: { 'x-admin-key': key },
      });
      const usersJson = await usersRes.json();

      if (!usersJson.success) {
        showError(usersJson.error || 'Failed to load users');
        return;
      }

      renderUsers(usersJson.users);
    } catch (err) {
      showError('Could not reach the backend. Check your connection.');
    }
  }

  function renderUsers(users) {
    const tbody = document.getElementById('usersBody');
    const table = document.getElementById('usersTable');
    const empty = document.getElementById('emptyState');

    if (!users || users.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    empty.style.display = 'none';

    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${escapeHtml(u.email)}</td>
        <td>${escapeHtml(u.name || '-')}</td>
        <td style="color:#666;font-size:12px;">${escapeHtml(u.uid)}</td>
        <td>${new Date(u.created_at).toLocaleString()}</td>
        <td><button class="delete-btn" onclick="deleteUser('${escapeHtml(u.uid)}')">Delete</button></td>
      </tr>
    `).join('');
  }

  async function deleteUser(uid) {
    if (!confirm(`Permanently delete user ${uid}? This cannot be undone.`)) return;
    const key = getKey();
    try {
      const res = await fetch(`${API_URL}/admin/users/${uid}`, {
        method: 'DELETE',
        headers: { 'x-admin-key': key },
      });
      const json = await res.json();
      if (!json.success) {
        showError(json.error || 'Delete failed');
        return;
      }
      loadAll();
    } catch (err) {
      showError('Could not reach the backend.');
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Auto-load if key already saved
  window.onload = () => {
    const saved = getKey();
    if (saved) {
      document.getElementById('adminKey').value = saved;
      loadAll();
    }
  };
</script>
</body>
</html>
</html>
