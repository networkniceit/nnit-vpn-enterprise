apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nnit-vpn-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.nnitvpn.com
    secretName: nnitvpn-tls
  rules:
  - host: api.nnitvpn.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
