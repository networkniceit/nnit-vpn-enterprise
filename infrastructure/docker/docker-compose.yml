version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nnit-vpn-postgres
    environment:
      POSTGRES_DB: nnit_vpn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nnit-vpn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentication Service
  auth-service:
    build:
      context: ../../backend/auth
      dockerfile: Dockerfile
    container_name: nnit-vpn-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - AUTH_PORT=3001
    depends_on:
      - redis
    volumes:
      - ../../backend/auth:/app
      - /app/node_modules

  # API Service
  api-service:
    build:
      context: ../../backend/api
      dockerfile: Dockerfile
    container_name: nnit-vpn-api
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - API_PORT=3002
      - DATABASE_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ../../backend/api:/app
      - /app/node_modules

  # Admin Service
  admin-service:
    build:
      context: ../../backend/admin
      dockerfile: Dockerfile
    container_name: nnit-vpn-admin
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - ADMIN_PORT=3003
    volumes:
      - ../../backend/admin:/app
      - /app/node_modules

  # Billing Service
  billing-service:
    build:
      context: ../../backend/billing
      dockerfile: Dockerfile
    container_name: nnit-vpn-billing
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - BILLING_PORT=3004
    volumes:
      - ../../backend/billing:/app
      - /app/node_modules

  # VPN Core Service
  vpn-core-service:
    build:
      context: ../../backend/vpn-core
      dockerfile: Dockerfile
    container_name: nnit-vpn-core
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - VPN_CORE_PORT=3005
    volumes:
      - ../../backend/vpn-core:/app
      - /app/node_modules

  # Monitoring Service
  monitoring-service:
    build:
      context: ../../backend/monitoring
      dockerfile: Dockerfile
    container_name: nnit-vpn-monitoring
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - MONITORING_PORT=3006
    volumes:
      - ../../backend/monitoring:/app
      - /app/node_modules

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: nnit-vpn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: nnit-vpn-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nnit-vpn-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-service
      - auth-service
      - admin-service

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
